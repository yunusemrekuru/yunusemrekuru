<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 40" width="175" height="40">
  <defs>
    <linearGradient id="btnBg_Instagram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1326" />
      <stop offset="100%" stop-color="#050813" />
    </linearGradient>
    <filter id="glow_Instagram" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E1306C" flood-opacity="0.35" />
    </filter>
  </defs>
  <style>
    .btn-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 0.3px;
    }
    .btn-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 9.5px;
      font-weight: 600;
      fill: #E1306C;
      letter-spacing: 0.4px;
    }
  </style>
  <rect x="1.5" y="1.5" width="172" height="37" rx="10" fill="url(#btnBg_Instagram)" stroke="#E1306C" stroke-width="1.5" stroke-opacity="0.75" filter="url(#glow_Instagram)" />
  <g transform="translate(14, 10)">
    
    <linearGradient id="igG" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fd5949" />
      <stop offset="50%" stop-color="#d6249f" />
      <stop offset="100%" stop-color="#285AEB" />
    </linearGradient>
    <rect width="20" height="20" rx="5" fill="url(#igG)" />
    <rect x="3" y="3" width="14" height="14" rx="4" fill="none" stroke="#ffffff" stroke-width="1.4" />
    <circle cx="10" cy="10" r="3.2" fill="none" stroke="#ffffff" stroke-width="1.4" />
    <circle cx="14" cy="6" r="0.9" fill="#ffffff" />
  
  </g>
  <text x="44" y="19" class="btn-title">Instagram</text>
  <text x="44" y="31" class="btn-sub">@kurudevworks</text>
