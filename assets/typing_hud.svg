<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 840 50" width="840" height="50">
  <defs>
    <linearGradient id="typingBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0c152a" />
      <stop offset="100%" stop-color="#050812" />
    </linearGradient>
    <linearGradient id="typingBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#00f2fe" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#4facfe" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0.85" />
    </linearGradient>
    <filter id="typingGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00f5d4" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    @keyframes pulseLed {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes blinkCursor {
      0%, 45% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .led-dot {
      transform-origin: 28px 25px;
      animation: pulseLed 2s infinite ease-in-out;
    }
    .term-cursor {
      animation: blinkCursor 0.75s infinite ease-in-out;
    }
    .txt-term-tag {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Fira Code", monospace;
      font-weight: 700;
      font-size: 13px;
      fill: #4facfe;
      letter-spacing: 0.5px;
    }
    .txt-term-line {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-weight: 600;
      font-size: 14.5px;
      fill: #00f5d4;
      letter-spacing: 0.3px;
    }
  </style>

  <!-- Container pill with glow -->
  <rect x="2" y="2" width="836" height="46" rx="23" fill="url(#typingBg)" stroke="url(#typingBorder)" stroke-width="1.5" filter="url(#typingGlow)" />

  <!-- Terminal Status LED -->
  <circle cx="28" cy="25" r="5" fill="#00f5d4" class="led-dot" />
  <circle cx="28" cy="25" r="2.5" fill="#ffffff" />

  <!-- Terminal prompt tag -->
  <text x="44" y="30" class="txt-term-tag">dev@kurudev:~$</text>

  <!-- Sleek divider -->
  <line x1="168" y1="13" x2="168" y2="37" stroke="#1c2844" stroke-width="1.5" />

  <!-- Typing Animation Loop -->
  <path id="tp0">
    <animate id="an0" attributeName="d" begin="0s;an3.end" dur="4200ms" fill="remove"
      values="m186,30.5 h0 ; m186,30.5 h530 ; m186,30.5 h530 ; m186,30.5 h0" keyTimes="0;0.5;0.85;1" />
  </path>
  <text class="txt-term-line">
    <textPath xlink:href="#tp0">
      Full-Stack Software Developer &amp; Mobile Specialist
    </textPath>
  </text>

  <path id="tp1">
    <animate id="an1" attributeName="d" begin="an0.end" dur="4200ms" fill="remove"
      values="m186,30.5 h0 ; m186,30.5 h530 ; m186,30.5 h530 ; m186,30.5 h0" keyTimes="0;0.5;0.85;1" />
  </path>
  <text class="txt-term-line">
    <textPath xlink:href="#tp1">
      Flutter &#8226; Supabase &#8226; Firebase &#8226; Python &#8226; PHP &#8226; C#
    </textPath>
  </text>

  <path id="tp2">
    <animate id="an2" attributeName="d" begin="an1.end" dur="4200ms" fill="remove"
      values="m186,30.5 h0 ; m186,30.5 h530 ; m186,30.5 h530 ; m186,30.5 h0" keyTimes="0;0.5;0.85;1" />
  </path>
  <text class="txt-term-line">
    <textPath xlink:href="#tp2">
      Founder @kurudevworks | Scalable Mobile &amp; Web Apps
    </textPath>
  </text>

  <path id="tp3">
    <animate id="an3" attributeName="d" begin="an2.end" dur="4200ms" fill="remove"
      values="m186,30.5 h0 ; m186,30.5 h530 ; m186,30.5 h530 ; m186,30.5 h0" keyTimes="0;0.5;0.85;1" />
  </path>
  <text class="txt-term-line">
    <textPath xlink:href="#tp3">
      Computer Vision &#8226; Applied AI &#8226; Scalable Architecture
    </textPath>
  </text>

  <!-- Right status badge -->
  <rect x="736" y="14" width="76" height="22" rx="11" fill="#00f5d4" fill-opacity="0.12" stroke="#00f5d4" stroke-width="1" stroke-opacity="0.4" />
  <circle cx="748" cy="25" r="3" fill="#00f5d4" />
  <text x="774" y="28.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#00f5d4" text-anchor="middle" letter-spacing="0.8">LIVE HUD</text>
</svg>