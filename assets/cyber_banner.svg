<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b17" />
      <stop offset="50%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#030611" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#cffafe" />
      <stop offset="70%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0.6" />
    </linearGradient>

    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="blueOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#0052d4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for Neon Glow -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="gridPattern" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#00f5d4" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Consolas, 'Fira Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .neon-pulse {
      animation: pulse 3s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="1196" height="416" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Cyber Grid -->
  <rect x="2" y="2" width="1196" height="416" rx="20" fill="url(#gridPattern)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="1020" cy="80" r="220" fill="url(#cyanOrb)" />
  <circle cx="120" cy="340" r="240" fill="url(#blueOrb)" />

  <!-- Decorative Circuit Lines -->
  <path d="M 850 40 L 980 40 L 1020 80 L 1150 80" fill="none" stroke="#00f5d4" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6,6" />
  <circle cx="850" cy="40" r="3" fill="#00f5d4" opacity="0.6" />
  <circle cx="1150" cy="80" r="4" fill="#00f2fe" opacity="0.8" />

  <path d="M 50 380 L 160 380 L 200 340 L 300 340" fill="none" stroke="#4facfe" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4,4" />
  <circle cx="300" cy="340" r="3" fill="#4facfe" opacity="0.6" />

  <!-- Top Status Pill -->
  <g transform="translate(70, 48)">
    <rect x="0" y="0" width="370" height="34" rx="17" fill="#0c182c" fill-opacity="0.75" stroke="#00f5d4" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="17" r="4.5" fill="#00f5d4" filter="url(#subtleGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="22" fill="#a5f3fc" font-size="11.5" font-weight="700" letter-spacing="2" class="mono">SYSTEM ONLINE • READY TO BUILD</text>
  </g>

  <!-- Title Prefix -->
  <text x="70" y="132" fill="#79c0ff" font-size="14" font-weight="600" letter-spacing="3.5" class="mono">// HELLO WORLD, I AM</text>

  <!-- Main Name Title -->
  <text x="70" y="196" fill="url(#textGrad)" font-size="54" font-weight="900" letter-spacing="-0.5" class="sans" filter="url(#subtleGlow)">YUNUS EMRE KURU</text>

  <!-- Subtitle -->
  <text x="70" y="240" fill="#94a3b8" font-size="18" font-weight="400" class="sans">
    <tspan fill="#00f5d4" font-weight="600">Full-Stack Software Developer</tspan>
    <tspan fill="#64748b">  |  </tspan>
    <tspan fill="#e2e8f0">Mobile &amp; Web Application Architect</tspan>
  </text>

  <text x="70" y="268" fill="#64748b" font-size="15" font-weight="400" class="sans">
    Specializing in Flutter, Modern Web Platforms, Cloud BaaS &amp; Computer Vision.
  </text>

  <!-- Badge Pills -->
  <g transform="translate(70, 310)">
    <!-- Badge 1: Flutter & Mobile -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="225" height="42" rx="10" fill="#0b162c" fill-opacity="0.8" stroke="#00f5d4" stroke-opacity="0.3" stroke-width="1" />
      <text x="18" y="26" fill="#00f5d4" font-size="16" class="sans">📱</text>
      <text x="44" y="26" fill="#cffafe" font-size="13" font-weight="600" class="mono">Flutter &amp; Mobile Apps</text>
    </g>

    <!-- Badge 2: Full-Stack & Cloud -->
    <g transform="translate(240, 0)">
      <rect x="0" y="0" width="265" height="42" rx="10" fill="#0b162c" fill-opacity="0.8" stroke="#4facfe" stroke-opacity="0.3" stroke-width="1" />
      <text x="18" y="26" fill="#4facfe" font-size="16" class="sans">⚡</text>
      <text x="44" y="26" fill="#cffafe" font-size="13" font-weight="600" class="mono">Full-Stack &amp; Cloud BaaS</text>
    </g>

    <!-- Badge 3: AI & Computer Vision -->
    <g transform="translate(520, 0)">
      <rect x="0" y="0" width="250" height="42" rx="10" fill="#0b162c" fill-opacity="0.8" stroke="#00f5d4" stroke-opacity="0.3" stroke-width="1" />
      <text x="18" y="26" fill="#38ef7d" font-size="16" class="sans">🧠</text>
      <text x="44" y="26" fill="#cffafe" font-size="13" font-weight="600" class="mono">Python &amp; OpenCV Lab</text>
    </g>
  </g>

  <!-- Right Decorative Cyber Tech Graphic -->
  <g transform="translate(1030, 210)">
    <!-- Rotating decorative diamond -->
    <rect x="-45" y="-45" width="90" height="90" rx="14" fill="#071124" fill-opacity="0.6" stroke="#00f5d4" stroke-opacity="0.5" stroke-width="1.8" transform="rotate(45)" filter="url(#subtleGlow)" />
    <rect x="-32" y="-32" width="64" height="64" rx="8" fill="none" stroke="#4facfe" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="5,5" transform="rotate(45)" />
    <circle cx="0" cy="0" r="10" fill="#00f5d4" fill-opacity="0.2" stroke="#00f5d4" stroke-width="1.5" />
    <circle cx="0" cy="0" r="3.5" fill="#00f5d4" />
    <text x="0" y="85" fill="#00f5d4" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="3" class="mono">KURU.DEV</text>
    <text x="0" y="100" fill="#4facfe" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="2" class="mono">EST. 2026</text>
  </g>
</svg>
