<svg fill="none" viewBox="0 0 1200 420" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes pulse-glow {
          0%, 100% { opacity: 0.35; transform: scale(1); }
          50% { opacity: 0.85; transform: scale(1.08); }
        }
        @keyframes float-badge {
          0%, 100% { transform: translateY(0px); }
          50% { transform: translateY(-7px); }
        }
        @keyframes cyber-shimmer {
          0% { background-position: -200% 0; }
          100% { background-position: 200% 0; }
        }

        .banner-container {
          width: 100%;
          height: 420px;
          background: radial-gradient(circle at 82% 18%, rgba(0, 245, 212, 0.2), transparent 48%),
                      radial-gradient(circle at 12% 82%, rgba(79, 172, 254, 0.24), transparent 52%),
                      linear-gradient(135deg, #070c18 0%, #0a1329 50%, #040812 100%);
          border-radius: 24px;
          overflow: hidden;
          position: relative;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
          box-sizing: border-box;
          border: 1px solid rgba(0, 245, 212, 0.32);
          box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), inset 0 0 40px rgba(0, 242, 254, 0.1);
        }

        .cyber-grid {
          position: absolute;
          inset: 0;
          background-image: 
            linear-gradient(to right, rgba(0, 245, 212, 0.07) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(0, 245, 212, 0.07) 1px, transparent 1px);
          background-size: 34px 34px;
          mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 45%, rgba(0,0,0,0.1) 90%);
        }

        .glow-orb-1 {
          position: absolute;
          width: 360px;
          height: 360px;
          right: -40px;
          top: -40px;
          background: radial-gradient(circle, #00f5d4 0%, rgba(0, 242, 254, 0.35) 45%, transparent 72%);
          filter: blur(60px);
          animation: pulse-glow 6s ease-in-out infinite;
        }

        .glow-orb-2 {
          position: absolute;
          width: 300px;
          height: 300px;
          left: 3%;
          bottom: -60px;
          background: radial-gradient(circle, #4facfe 0%, rgba(0, 119, 182, 0.35) 50%, transparent 72%);
          filter: blur(55px);
          animation: pulse-glow 8s ease-in-out infinite reverse;
        }

        .content {
          position: relative;
          z-index: 10;
          height: 100%;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding: 0 70px;
        }

        .hud-status {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          background: rgba(0, 245, 212, 0.1);
          border: 1px solid rgba(0, 245, 212, 0.4);
          border-radius: 9999px;
          padding: 7px 22px;
          width: fit-content;
          margin-bottom: 20px;
          backdrop-filter: blur(10px);
        }

        .status-dot {
          width: 9px;
          height: 9px;
          background-color: #00f5d4;
          border-radius: 50%;
          box-shadow: 0 0 12px #00f5d4, 0 0 24px #00f5d4;
          animation: pulse-glow 2s infinite;
        }

        .status-text {
          color: #a5f3fc;
          font-size: 13px;
          font-weight: 700;
          letter-spacing: 2.5px;
          text-transform: uppercase;
        }

        .title-prefix {
          font-size: 15px;
          font-weight: 600;
          color: #79c0ff;
          letter-spacing: 4px;
          margin-bottom: 8px;
          text-transform: uppercase;
          font-family: 'SF Mono', Consolas, monospace;
        }

        .main-title {
          font-size: 56px;
          font-weight: 900;
          line-height: 1.08;
          margin: 0;
          background: linear-gradient(90deg, #ffffff 0%, #cffafe 30%, #00f5d4 70%, #00f2fe 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          filter: drop-shadow(0 4px 20px rgba(0, 245, 212, 0.32));
          letter-spacing: -0.5px;
        }

        .subtitle {
          font-size: 19px;
          color: #94a3b8;
          font-weight: 400;
          margin-top: 14px;
          max-width: 720px;
          line-height: 1.5;
        }

        .accent-text {
          color: #00f5d4;
          font-weight: 600;
        }

        .badge-bar {
          display: flex;
          gap: 14px;
          margin-top: 26px;
          align-items: center;
          flex-wrap: wrap;
        }

        .hud-pill {
          background: rgba(11, 22, 44, 0.8);
          border: 1px solid rgba(0, 242, 254, 0.3);
          border-radius: 9px;
          padding: 8px 18px;
          color: #cffafe;
          font-size: 13px;
          font-family: 'SF Mono', Consolas, monospace;
          display: flex;
          align-items: center;
          gap: 8px;
          backdrop-filter: blur(14px);
          animation: float-badge 4s ease-in-out infinite;
          box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
        }

        .hud-pill:nth-child(2) {
          animation-delay: 1.2s;
          border-color: rgba(0, 245, 212, 0.35);
        }

        .hud-pill:nth-child(3) {
          animation-delay: 2.4s;
          border-color: rgba(79, 172, 254, 0.35);
        }

        .decor-right {
          position: absolute;
          right: 75px;
          top: 50%;
          transform: translateY(-50%);
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 16px;
          opacity: 0.85;
        }

        .decor-cube {
          width: 90px;
          height: 90px;
          border: 2px solid rgba(0, 245, 212, 0.5);
          transform: rotate(45deg);
          position: relative;
          box-shadow: 0 0 32px rgba(0, 245, 212, 0.3), inset 0 0 20px rgba(0, 242, 254, 0.25);
        }

        .decor-cube::after {
          content: '';
          position: absolute;
          inset: 12px;
          border: 1px dashed rgba(79, 172, 254, 0.6);
        }

        .decor-text {
          font-family: 'SF Mono', Consolas, monospace;
          color: #00f5d4;
          font-size: 11px;
          letter-spacing: 3px;
          writing-mode: vertical-rl;
          text-orientation: mixed;
          font-weight: 700;
        }
      </style>

      <div class="banner-container">
        <div class="cyber-grid"></div>
        <div class="glow-orb-1"></div>
        <div class="glow-orb-2"></div>

        <div class="content">
          <div class="hud-status">
            <div class="status-dot"></div>
            <span class="status-text">SYSTEM ONLINE &bull; READY TO BUILD</span>
          </div>

          <div class="title-prefix">// HELLO WORLD, I AM</div>
          <h1 class="main-title">YUNUS EMRE KURU</h1>
          <p class="subtitle">
            <span class="accent-text">Full-Stack Software Developer</span> &bull; Specializing in 
            <span style="color: #79c0ff; font-weight: 600;">Mobile &amp; Web Applications</span>, 
            Cloud Architectures and Computer Vision.
          </p>

          <div class="badge-bar">
            <div class="hud-pill">
              <span style="color:#00f5d4;">📱</span> Flutter &amp; Mobile Apps
            </div>
            <div class="hud-pill">
              <span style="color:#4facfe;">⚡</span> Full-Stack &amp; Cloud (Supabase/Firebase)
            </div>
            <div class="hud-pill">
              <span style="color:#38ef7d;">🧠</span> Python &amp; Computer Vision
            </div>
          </div>
        </div>

        <div class="decor-right">
          <div class="decor-cube"></div>
          <div class="decor-text">KURU.DEV.2026</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
